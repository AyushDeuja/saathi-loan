[toolchain]
# Anchor CLI vs `anchor-lang` versions: install a matching CLI with avm, e.g.:
#   avm install 0.32.1 && avm use 0.32.1
# Pinning `anchor_version` here can force tooling paths that require newer Cargo; prefer avm.

[features]
resolution = true
skip-lint = false

